server {
    listen 80;
    server_name _;
    root /var/www/html;

    index index.php index.html;
    charset utf-8;

    client_max_body_size 100M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. Anti-PHP-Shell: Block direct access to vulnerable KCFinder upload/browse scripts
    location ~* /kcfinder/ {
        deny all;
        return 403;
    }

    # 2. Anti-PHP-Shell: Block any PHP execution in upload, cache, assets, docs, and system folders
    location ~* /(?:upload|cache|assets|docs|docker|db-data)/.*\.php$ {
        deny all;
        return 403;
    }

    location /backend/ {
        try_files $uri $uri/ /backend/index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
